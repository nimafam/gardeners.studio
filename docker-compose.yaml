services:
  postgres:
    image: postgres:16
    container_name: gardeners_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gardeners}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gardeners_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-gardeners}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - gardeners_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gardeners} -d ${POSTGRES_DB:-gardeners}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gardeners_postgres_data:
